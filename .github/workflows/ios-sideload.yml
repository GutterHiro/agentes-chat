name: iOS sideload (unsigned .ipa)

# Builds an UNSIGNED .ipa for personal sideloading with AltStore/SideStore (free Apple ID), with no Apple secrets.
# Same steps as ios.yml up to the archive, but with signing off; AltStore signs the app on the phone's side.
# Builds this branch with upstream's main merged in. By hand (Actions → iOS sideload → Run workflow), or daily at
# 03:00 BRT when upstream's app code changed in the last day. See SIDELOAD-iOS.md.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: ios-sideload-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  UPSTREAM: https://github.com/agentes-chat/agentes-chat.git

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changed.outputs.build }}
    steps:
      - id: changed
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then echo build=true >> "$GITHUB_OUTPUT"; exit 0; fi
          git init -q up && cd up
          git fetch -q --filter=blob:none --shallow-since="2 days ago" "$UPSTREAM" main
          changes=$(git log --since="25 hours ago" --oneline FETCH_HEAD -- apps/mobile packages package.json bun.lock | wc -l)
          echo "::notice::$changes upstream commits touching the app in the last 25 h"
          echo build=$([ "$changes" -gt 0 ] && echo true || echo false) >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APP_VARIANT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Merge upstream main
        run: |
          git config user.name ci && git config user.email ci@localhost
          git fetch -q "$UPSTREAM" main
          git merge --no-edit FETCH_HEAD
          echo "::notice::upstream $(git rev-parse --short FETCH_HEAD)"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: bun install --frozen-lockfile
      - name: Native project
        working-directory: apps/mobile
        run: |
          bunx expo prebuild --platform ios --clean --no-install
          cd ios
          command -v pod > /dev/null || sudo gem install cocoapods --no-document
          pod install
      - name: Archive (unsigned)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          workspace=$(ls -d *.xcworkspace | head -1)
          scheme="${workspace%.xcworkspace}"
          xcodebuild archive \
            -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/app.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -300 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -20 "$RUNNER_TEMP/archive.log"
      - name: Package .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          # -y keeps the frameworks' symlinks as symlinks.
          zip -qry agentes-unsigned.ipa Payload
          app=$(ls -d Payload/*.app | head -1)
          echo "::notice::$(basename "$app"), iOS mínimo $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$app/Info.plist"), extensões: $(ls "$app/PlugIns" 2>/dev/null | tr '\n' ' ')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentes-ios-unsigned-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa/agentes-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      # Optional: with the RCLONE_CONF secret (an rclone remote named gdrive, scope drive.file), the .ipa also goes to
      # Google Drive's agentes-ios folder, replacing the previous one. See SIDELOAD-iOS.md.
      - name: Google Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then echo "::notice::no RCLONE_CONF, skipping Drive"; exit 0; fi
          brew install --quiet rclone
          printf '%s\n' "$RCLONE_CONF" > "$RUNNER_TEMP/rclone.conf"
          export RCLONE_CONFIG="$RUNNER_TEMP/rclone.conf"
          rclone delete gdrive:agentes-ios --include "*.ipa" 2>/dev/null || true
          name="agentes-$(TZ=America/Sao_Paulo date +%F)-build${{ github.run_number }}.ipa"
          rclone copyto "$RUNNER_TEMP/ipa/agentes-unsigned.ipa" "gdrive:agentes-ios/$name"
          echo "::notice::Drive: agentes-ios/$name"
